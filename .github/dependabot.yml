version: 2
updates:
  - package-ecosystem: pip
    directory: /eventra-backend
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"], update-types: [minor, patch] } }

  - package-ecosystem: npm
    directory: /eventra-frontend
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"], update-types: [minor, patch] } }

  - package-ecosystem: docker
    directory: /eventra-backend
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups: { images: { patterns: ["*"], update-types: [minor, patch] } }
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"], update-types: [minor, patch] } }
