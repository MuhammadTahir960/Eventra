name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eventra-backend

    env:
      ENV_FILE: .github/ci.env
      POSTGRES_DB: eventra_test
      POSTGRES_USER: eventra_test
      POSTGRES_PASSWORD: eventra_test
      REDIS_PASSWORD: ci-redis-password
      DATABASE_URL: postgres://eventra_test:eventra_test@localhost:5432/eventra_test
      REDIS_URL: redis://:ci-redis-password@localhost:6379/0

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Load the CI settings
        working-directory: .
        run: grep -vE '^[[:space:]]*(#|$)' .github/ci.env >> "$GITHUB_ENV"

      - name: Start Postgres and Redis from docker-compose.yml
        working-directory: .
        run: docker compose up -d --wait postgres redis

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          check-latest: true
          cache: "pip"
          cache-dependency-path: |
            eventra-backend/requirements/base.txt
            eventra-backend/requirements/dev.txt
            eventra-backend/requirements/prod.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt -r requirements/prod.txt

      - name: Dependency audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements/dev.txt -r requirements/prod.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pinned by digest: Trivy's GitHub Action was hijacked in March 2026.
      # shortcut: Dependabot doesn't update this pin, bump it by hand with each Trivy release
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      ENV_FILE: .github/ci.env
      POSTGRES_DB: eventra
      POSTGRES_USER: eventra
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      NGINX: http://localhost
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Start the whole stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke-test through nginx and the workers
        run: |
          expect() {
            # "|| true": a refused connection (nginx down) reports as 000, not a bare exit
            code=$(curl -s -o /dev/null -w "%{http_code}" "$NGINX$2" || true)
            [ "$code" = "$1" ] || { echo "GET $2: expected $1, got $code"; exit 1; }
            echo "GET $2: $code"
          }
          expect 200 /healthz/
          expect 200 /countries/
          expect 200 /events/
          expect 200 /events/locations/
          expect 401 /bookings/
          expect 200 /django-admin/login/
          expect 200 /static/admin/css/base.css
          # The worker has no health check, so give it up to a minute to connect
          for attempt in 1 2 3 4 5 6; do
            docker compose exec -T celery-worker celery -A config inspect ping --timeout 10 && break
            [ "$attempt" -lt 6 ] || exit 1
          done

      - name: Save the images the stack ran with
        if: ${{ !cancelled() }}
        run: |
          mkdir scan
          for service in web postgres redis nginx; do
            image="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q "$service")")"
            docker save -o "scan/$service.tar" "$image"
          done

      - name: Scan with Trivy (fails on fixable high and critical CVEs in our image)
        if: ${{ !cancelled() }}
        run: |
          status=0
          for archive in scan/*.tar; do
            name="$(basename "$archive" .tar)"
            # The skipped jars are Debian's gettext package in the nginx image, already
            # scanned as an OS package; scanning them again needs Trivy's large Java DB
            docker run --rm -v "$PWD/scan:/scan" -v trivy-cache:/root/.cache \
              -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY" \
              image --quiet --scanners vuln --ignorefile /.trivyignore \
              --skip-dirs /usr/share/java,/usr/share/maven-repo \
              --input "/scan/$name.tar" --severity HIGH,CRITICAL \
              --format json --output "/scan/$name.json"
            fixable=$(jq '[.Results[]?.Vulnerabilities[]? | select(.FixedVersion)] | length' "scan/$name.json")
            echo "== $name: $fixable fixable"
            jq -r '.Results[]?.Vulnerabilities[]?
              | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix yet")"' \
              "scan/$name.json"
            if [ "$name" = web ] && [ "$fixable" -gt 0 ]; then status=1; fi
          done
          exit "$status"

      - name: Show the logs if it failed
        if: failure()
        run: docker compose logs --no-color --tail 80

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eventra-frontend

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          check-latest: true
          cache: "npm"
          cache-dependency-path: eventra-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high

      - name: Oxlint
        run: npx oxlint --deny-warnings

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test

      - name: Type check and production build
        run: npm run build