name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eventra-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eventra_test
          POSTGRES_USER: eventra_test
          POSTGRES_PASSWORD: eventra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      DATABASE_URL: postgres://eventra_test:eventra_test@localhost:5432/eventra_test
      REDIS_URL: redis://:ci-redis-password@localhost:6379/0
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key_for_settings_boot
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy_key_for_settings_boot
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_key_for_settings_boot

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Start Redis with a password
        working-directory: .
        run: |
          docker run -d --name redis -p 6379:6379 redis:7 redis-server --requirepass ci-redis-password
          until docker exec -e REDISCLI_AUTH=ci-redis-password redis redis-cli ping | grep -q PONG; do sleep 1; done

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          check-latest: true
          cache: "pip"
          cache-dependency-path: |
            eventra-backend/requirements/base.txt
            eventra-backend/requirements/dev.txt
            eventra-backend/requirements/prod.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt -r requirements/prod.txt

      - name: Dependency audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements/dev.txt -r requirements/prod.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest

  nginx-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-light

      - name: Stub the "web" upstream hostname for this CI job only
        run: echo "127.0.0.1 web" | sudo tee -a /etc/hosts

      - name: Syntax-check nginx.conf (nginx -t)
        run: |
          sudo cp nginx/nginx.conf /etc/nginx/conf.d/eventra-syntax-check.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo rm -f /etc/nginx/conf.d/eventra-syntax-check.conf

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eventra-frontend

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          check-latest: true
          cache: "npm"
          cache-dependency-path: eventra-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high

      - name: Oxlint
        run: npx oxlint --deny-warnings

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test