name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eventra-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eventra_test
          POSTGRES_USER: eventra_test
          POSTGRES_PASSWORD: eventra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      DATABASE_URL: postgres://eventra_test:eventra_test@localhost:5432/eventra_test
      REDIS_URL: redis://localhost:6379/0
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key_for_settings_boot
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy_key_for_settings_boot
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_key_for_settings_boot

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            eventra-backend/requirements/base.txt
            eventra-backend/requirements/dev.txt
            eventra-backend/requirements/prod.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt -r requirements/prod.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest

  nginx-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-light

      - name: Stub the "web" upstream hostname for this CI job only
        run: echo "127.0.0.1 web" | sudo tee -a /etc/hosts

      - name: Syntax-check nginx.conf (nginx -t)
        run: |
          sudo cp nginx/nginx.conf /etc/nginx/conf.d/eventra-syntax-check.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo rm -f /etc/nginx/conf.d/eventra-syntax-check.conf

      - name: Start nginx with the real config
        run: |
          sudo mkdir -p /app/staticfiles /app/mediafiles
          sudo cp nginx/nginx.conf /etc/nginx/conf.d/default.conf
          sudo nginx
          sleep 1

      - name: Verify /internal/ is denied at the reverse-proxy layer (403)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/internal/seats/broadcast/)
          echo "GET /internal/seats/broadcast/ -> $status"
          if [ "$status" != "403" ]; then
            echo "::error::Expected /internal/seats/broadcast/ to be denied with 403 at the nginx layer, got $status instead."
            exit 1
          fi

      - name: Verify the deny block covers nested /internal/ paths too
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/internal/anything/nested/path/)
          echo "GET /internal/anything/nested/path/ -> $status"
          if [ "$status" != "403" ]; then
            echo "::error::Expected a nested /internal/... path to be denied with 403, got $status instead."
            exit 1
          fi

      - name: Sanity check — a non-/internal/ path is NOT denied by the same rule
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/healthz/)
          echo "GET /healthz/ -> $status"
          if [ "$status" = "403" ]; then
            echo "::error::/healthz/ was denied (403) -- the /internal/ deny block appears to be too broad."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eventra-frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: eventra-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Oxlint
        run: npx oxlint --deny-warnings

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test